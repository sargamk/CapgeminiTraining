<!DOCTYPE html>
<html>
<head>
<title>My AWS S3 Website</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#4facfe,#00f2fe);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    text-align:center;
    width:400px;
}

h1{
    color:#333;
}

p{
    color:#555;
    font-size:18px;
}

button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:25px;
    background:#4facfe;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#00c6ff;
    transform:scale(1.05);
}

.footer{
    margin-top:20px;
    font-size:14px;
    color:gray;
}
</style>

</head>

<body>

<div class="container">

<h1>🚀 Welcome to My AWS Website</h1>

<p>This static website is hosted on <b>Amazon S3</b>.</p>

<p>Created by an Engineering Student exploring Cloud ☁️</p>

<button onclick="alert('Hello from AWS S3!')">
Click Me
</button>

<div class="footer">
Powered by AWS S3 Static Hosting
</div>

</div>

</body>
</html>
